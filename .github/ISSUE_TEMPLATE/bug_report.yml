name: Bug report
description: Something in TokenTier does not work as expected
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example macOS 15.1 or Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `tokentier doctor`
      description: Paste the full output. Remove anything private (project paths) first if you prefer.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
